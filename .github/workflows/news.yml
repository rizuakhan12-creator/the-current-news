name: Draft news for editorial review
on:
  schedule:
    - cron: '17 */6 * * *' # UTC; edit to change frequency
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: news-drafts
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify OpenAI connection on manual runs
        if: github.event_name == 'workflow_dispatch'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
        run: |
          python - <<'PY'
          import os
          import sys
          from openai import OpenAI, APIStatusError, APIConnectionError
          if not os.getenv('OPENAI_API_KEY'):
              sys.exit('OPENAI_API_KEY secret is missing.')
          try:
              response = OpenAI(timeout=30, max_retries=0).responses.create(
                  model=os.getenv('OPENAI_MODEL', 'gpt-4.1-mini'),
                  input='Reply with OK.', max_output_tokens=32, store=False)
              if response.status != 'completed':
                  sys.exit('OpenAI request did not complete; inspect model configuration.')
              print('OpenAI API connection and generation test passed. No secret or response text logged.')
          except APIStatusError as exc:
              code = exc.code if exc.code in {'insufficient_quota', 'invalid_api_key', 'model_not_found', 'rate_limit_exceeded'} else 'request_rejected'
              sys.exit(f'OpenAI API test failed: HTTP {exc.status_code}, code={code}. Check project billing, key permissions and model access.')
          except APIConnectionError:
              sys.exit('OpenAI connection failed. Retry after checking service connectivity.')
          PY
      - run: python scripts/review_queue.py restore
      - run: python scripts/news.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          MAX_DRAFTS: ${{ vars.MAX_DRAFTS || '3' }}
      - run: python scripts/review_queue.py save
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-drafts
          path: content/drafts/*.json
          if-no-files-found: ignore
          retention-days: 14

