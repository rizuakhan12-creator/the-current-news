name: Collect RSS for manual review
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: news-drafts
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/review_queue.py restore
        id: restore
      - run: python scripts/news.py
        env:
          MAX_ITEMS: ${{ vars.MAX_ITEMS || '10' }}
      - run: python scripts/review_queue.py save
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rss-editorial-leads
          path: content/drafts/*.json
          if-no-files-found: ignore
          retention-days: 14
